# Golden case: the WireGuard VPN (ADR 0018) with two devices, reaching only the
# internet, managed over the VPN too, and a rule letting it reach the NAS.
schema_version = 1

[system]
hostname = "gw"
domain = "home.arpa"

[management]
allowed_zones = ["lan", "vpn"]

[[interface]]
name = "wan"
match_device = "eth0"
ipv4 = "dhcp"

[[interface]]
name = "lan"
match_device = "eth1"
ipv4 = "192.168.10.1/24"

[dhcp.lan]
range = ["192.168.10.100", "192.168.10.199"]

[vpn]
port = 51821
reach = "internet"

[[vpn.peer]]
name = "phone"
public_key = "HIgo9xNzJMWLKASShiTqIybxZ0U3wGLiUeJ1PKf8ykw="
ipv4 = "10.66.0.2"

[[vpn.peer]]
name = "laptop"
public_key = "xTIBA5rboUvnH4htodjb6e697QjLERt1NAB4mZqp8Dg="
ipv4 = "10.66.0.3"

[[firewall.policy]]
from = "vpn"
to = "lan"
action = "accept"
comment = "VPN devices reach the LAN too"

[[firewall.policy]]
from = "lan"
to = "*"
action = "accept"
