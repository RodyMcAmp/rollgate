#
# DHCPv4 and local names for the interfaces with a [dhcp.<name>] section
# (ADR 0006). All other names are resolved by Unbound on 127.0.0.1#5335.
# IPv6 addresses and router advertisements are networkd's job, not dnsmasq's.

# DNS
port=53
no-resolv
no-hosts
server=127.0.0.1#5335
# Never forward plain names or private reverse lookups to the internet.
domain-needed
bogus-priv
domain=home.arpa
local=/home.arpa/
interface=eth1
# The VPN (ADR 0018): DNS only.
interface=vpn
bind-dynamic
# The router's own name resolves to its address on the asking client's network.
localise-queries
interface-name=gw.home.arpa,eth1/4
interface-name=gw.home.arpa,vpn/4

# DHCP
dhcp-authoritative

# interface "lan"
dhcp-range=set:lan,192.168.10.100,192.168.10.199,255.255.255.0,12h
dhcp-option=tag:lan,option:router,192.168.10.1
dhcp-option=tag:lan,option:dns-server,192.168.10.1
