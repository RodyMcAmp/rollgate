# Golden case: DNS blocklists (ADR 0019): unbound.conf includes the downloaded
# names; nothing else changes.
schema_version = 1

[system]
hostname = "gw"
domain = "home.arpa"

[[interface]]
name = "wan"
match_device = "eth0"
ipv4 = "dhcp"

[[interface]]
name = "lan"
match_device = "eth1"
ipv4 = "192.168.10.1/24"

[dhcp.lan]
range = ["192.168.10.100", "192.168.10.199"]

[dns]
blocklists = ["recommended", "https://lists.example/extra.txt"]
allow = ["shop.example.com"]
