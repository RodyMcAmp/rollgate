# Generated by rollgate compile from router.toml (sha256 6e39f87a6462d9518b4edc93078cff07b5268d1aa5e1bffad26b182dc8255f63).
# Do not edit: change router.toml instead (docs/architecture.md#config-flow).
#
# Recursive resolver behind dnsmasq (ADR 0006). Only dnsmasq on this router
# queries it, on 127.0.0.1 port 5335.

server:
	interface: 127.0.0.1@5335
	access-control: 127.0.0.0/8 allow
	do-ip6: yes
	username: "unbound"
	directory: "/etc/unbound"
	# DNSSEC: the root trust anchor from the dnssec-anchors package.
	trust-anchor-file: "/etc/unbound/trusted-key.key"
	hide-identity: yes
	hide-version: yes
	qname-minimisation: yes
	prefetch: yes
	# Names in the local domain belong to dnsmasq, and internet names must never
	# resolve to local addresses (DNS rebinding protection).
	private-domain: "home.arpa"
	private-address: 10.0.0.0/8
	private-address: 172.16.0.0/12
	private-address: 192.168.0.0/16
	private-address: 169.254.0.0/16
	private-address: fd00::/8
	private-address: fe80::/10

# dns.blocklists (ADR 0019): the names rollgate dns update downloaded, kept
# inside Unbound's chroot. The pattern matches nothing until the first download.
include: "/etc/unbound/rollgate-blocklist*.conf"
