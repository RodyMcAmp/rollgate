# L3 apply test: the mistake commit-confirm exists for. Management moves to the
# iot zone, so SSH from lan (where the admin is) is refused. A valid config:
# iot has a static address, so validation (E004) can't catch it.
schema_version = 1

[management]
allowed_zones = ["iot"]
ssh_authorized_keys = ["admin.pub"]
confirm_timeout_seconds = 30

[[interface]]
name = "wan"
match_mac = "52:54:00:00:00:02"
ipv4 = "dhcp"

[[interface]]
name = "lan"
match_mac = "52:54:00:00:00:01"
ipv4 = "10.0.2.15/24"

[[vlan]]
name = "iot"
parent = "lan"
id = 20
ipv4 = "192.168.20.1/24"

[dhcp.iot]
range = ["192.168.20.100", "192.168.20.199"]
