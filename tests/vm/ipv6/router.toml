# L3 IPv6 test (tests/vm/ipv6-test.sh). lan is QEMU's user-mode network, used only
# to manage the router over SSH; wan connects to a fake ISP and home to a client,
# both network namespaces on the host. ipv6 = "auto" is the default.
schema_version = 1

[management]
allowed_zones = ["lan"]
ssh_authorized_keys = ["admin.pub"]

[[interface]]
name = "wan"
match_mac = "52:54:00:00:00:02"
ipv4 = "dhcp"

[[interface]]
name = "lan"
match_mac = "52:54:00:00:00:01"
ipv4 = "10.0.2.15/24"

[[interface]]
name = "home"
match_mac = "52:54:00:00:00:03"
ipv4 = "192.168.30.1/24"

[dhcp.home]
range = ["192.168.30.100", "192.168.30.199"]
