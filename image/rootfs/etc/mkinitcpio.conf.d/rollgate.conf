# rollgate initramfs hooks.
# - No autodetect: the image is built on one machine and boots on another, so the
#   initramfs must carry generic storage drivers.
# - busybox-based (udev) init, because grub-btrfs-overlayfs needs it. That hook lets a
#   read-only snapshot chosen from the GRUB menu boot with a temporary writable overlay.
HOOKS=(base udev microcode modconf block keyboard filesystems grub-btrfs-overlayfs)
