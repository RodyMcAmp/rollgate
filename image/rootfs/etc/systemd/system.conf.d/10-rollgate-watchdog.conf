# Reboot the router by itself if it hangs (ADR 0004; docs/architecture.md, "Update
# flow"). systemd keeps the board's watchdog fed; if the kernel or systemd stops,
# the watchdog resets the board after 30 seconds. rollgate-softdog.service loads a
# software watchdog on boards without one.
[Manager]
RuntimeWatchdogSec=30s
# A reboot that itself hangs is cut short too.
RebootWatchdogSec=2min
