# Booting a read-only snapshot from the GRUB menu puts / on an overlay
# (grub-btrfs-overlayfs hook). fstab's Btrfs options can't be applied to an overlay, so
# skip the remount there instead of failing and leaving the system "degraded" in the
# middle of a recovery. Normal boots are unaffected.
[Service]
ExecCondition=/bin/sh -c '[ "$(findmnt -no FSTYPE /)" != overlay ]'
