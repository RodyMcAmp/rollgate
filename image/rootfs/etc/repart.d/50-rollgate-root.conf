# The root partition grows to fill the disk (docs/architecture.md#disk-growth). The
# image is 8 GB; the disk it is written to is usually bigger. systemd-repart.service
# does this at boot, and does nothing once the partition fills the disk. The ESP isn't
# listed, so it stays as it is. rollgate-growfs.service then grows the filesystem.
[Partition]
Type=root
