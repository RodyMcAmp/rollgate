#!/usr/bin/nft -f
# M1 placeholder ruleset. Replaced by compiler output in M2.
# Inbound: default drop; SSH (keys only) allowed until M2 restricts it to LAN zones.
# Forwarding: off. The M1 image is not a router yet.

flush ruleset

table inet rollgate {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif lo accept
    meta l4proto { icmp, ipv6-icmp } limit rate 10/second accept
    udp dport 546 ip6 saddr fe80::/10 accept comment "DHCPv6 client replies"
    tcp dport 22 accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }
}
