#!/usr/bin/nft -f
# Image default until the first `rollgate apply` replaces it with the compiled ruleset.
# Inbound: default drop; SSH (keys only) allowed from anywhere until then.
# Forwarding: off. The router forwards nothing before it is configured.

flush ruleset

table inet rollgate {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif lo accept
    meta l4proto { icmp, ipv6-icmp } limit rate 10/second accept
    udp dport 546 ip6 saddr fe80::/10 accept comment "DHCPv6 client replies"
    tcp dport 22 accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }
}
