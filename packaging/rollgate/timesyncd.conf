# Installed as /usr/lib/systemd/timesyncd.conf.d/10-rollgate.conf (ADR 0013, 0015).
# Arch's default time servers, with Cloudflare's time service by its published anycast
# addresses after the first: timesyncd tries them in this order, so a router that
# can't look up names reaches an address after one failed lookup, not four.
[Time]
FallbackNTP=0.arch.pool.ntp.org 162.159.200.1 162.159.200.123 1.arch.pool.ntp.org 2.arch.pool.ntp.org 3.arch.pool.ntp.org
