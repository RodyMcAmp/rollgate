# rollgate (ADR 0020), for getty@ (screens): while root has no password, the console
# asks for the router's password before the first login prompt; then, and on every
# later start, rollgate setup writes what the prompt shows above itself (where the
# web UI is) and becomes agetty, with systemd's own arguments for getty@.
# It runs as the main process, not ExecStartPre, so the unit counts as started at once
# and the boot finishes while the setup screen waits for someone to type.
[Service]
ExecStart=
ExecStart=-/usr/bin/rollgate setup -- /usr/bin/agetty --noreset --noclear - ${TERM}
