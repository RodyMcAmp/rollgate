{{template "top" .}}
<section>
<h2>Health {{if .HealthOK}}<span class="ok">all checks pass</span>{{else}}<span class="bad">something needs attention</span>{{end}}</h2>
<pre>{{.Health}}</pre>
</section>
<section>
<h2>Status</h2>
<pre>{{.Status}}</pre>
</section>
<p class="hint">To change the router's settings, open <a href="/settings">Settings</a>. For a new release, open <a href="/updates">Updates</a>.</p>
{{template "bottom" .}}
