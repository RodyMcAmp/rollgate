<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rollgate: status</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
<h1>rollgate</h1>
<form method="post" action="/logout">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<button type="submit" class="link">Log out</button>
</form>
</header>
<main>
{{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}
<section>
<h2>Health {{if .HealthOK}}<span class="ok">all checks pass</span>{{else}}<span class="bad">something needs attention</span>{{end}}</h2>
<pre>{{.Health}}</pre>
</section>
<section>
<h2>Status</h2>
<pre>{{.Status}}</pre>
</section>
<p class="hint">Changing settings from this page comes in a later version. Until then, edit <code>/etc/rollgate/router.toml</code> over SSH and run <code>rollgate apply</code>.</p>
</main>
</body>
</html>
