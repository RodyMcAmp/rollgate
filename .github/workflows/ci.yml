# CI is the source of truth (docs/testing.md): L0 + L1 on every push to main and every
# PR, then build the image and run the L3 tests.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: L0 + L1 checks
    runs-on: ubuntu-latest
    # The same Arch tools as docs/dev-setup.md, so local and CI results match.
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install check tools
        run: pacman -Syu --noconfirm --needed make shellcheck go staticcheck
      - run: make check

  image:
    name: Build image + L3 boot test
    needs: check
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # Loop devices for the filesystem images, /dev/kvm for QEMU.
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed make arch-install-scripts btrfs-progs \
            dosfstools gptfdisk grub qemu-system-x86 edk2-ovmf openssh
      - name: Build image
        run: make image
      - name: L3 boot test
        run: make test-vm
      - name: L3 rollback rehearsal
        run: make test-rollback
      - name: Keep serial logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: serial-logs
          path: build/test-logs/
          if-no-files-found: ignore
