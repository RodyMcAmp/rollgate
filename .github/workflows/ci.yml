# CI is the source of truth (docs/testing.md): L0 + L1 on every push to main and every
# PR, then build the image and run the L3 tests.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: L0 + L1 checks
    runs-on: ubuntu-latest
    # The same Arch tools as docs/dev-setup.md, so local and CI results match.
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install check tools
        run: pacman -Syu --noconfirm --needed make shellcheck go staticcheck fakeroot
      - run: make check

  netns:
    name: L2 namespace tests
    needs: check
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # Creating network namespaces and loading nftables rules needs root privileges.
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - name: Install test tools
        run: pacman -Syu --noconfirm --needed make go iproute2 nftables procps-ng dnsmasq unbound openssh
      - run: make test-netns

  image:
    name: Build image + L3 boot test
    needs: check
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # Loop devices for the filesystem images, /dev/kvm for QEMU.
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed make arch-install-scripts btrfs-progs \
            dosfstools gptfdisk grub qemu-system-x86 edk2-ovmf openssh go \
            iproute2 iputils dnsmasq fakeroot qemu-img wireguard-tools squashfs-tools
      # The pinned snapshot's packages never change, so keep them between runs
      # instead of downloading ~625 MB from archive.archlinux.org every time.
      # pacman still checks every package's signature when installing.
      - name: Restore package cache
        uses: actions/cache@v5
        with:
          path: build/pkgcache
          key: pkgcache-${{ hashFiles('image/snapshot-date', 'image/packages.txt', 'image/installer/packages.txt') }}
          restore-keys: pkgcache-
      - name: Build image
        run: make image
      - name: L3 boot test
        run: make test-vm
      - name: L3 apply test
        run: make test-apply
      - name: L3 IPv6 test
        run: make test-ipv6
      - name: L3 update trial test
        run: make test-trial
      - name: L3 rollback rehearsal
        run: make test-rollback
      - name: L3 clock test
        run: make test-clock
      - name: L3 VMware test
        run: make test-vmware
      - name: L3 API test
        run: make test-api
      - name: L3 web UI test
        run: make test-web
      - name: L3 DNS blocklist test
        run: make test-blocklists
      - name: L3 VPN test
        run: make test-vpn
      - name: L3 first-boot test
        run: make test-firstboot
      - name: Build the USB installer image
        run: make installer
      - name: L3 install test
        run: make test-install
      - name: Keep serial logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: serial-logs
          path: build/test-logs/
          if-no-files-found: ignore

  update:
    name: L4 update test
    needs: check
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed make arch-install-scripts btrfs-progs \
            dosfstools gptfdisk grub qemu-system-x86 edk2-ovmf openssh go fakeroot
      # The previous release's packages, cached like the image job's. The update
      # itself downloads the week's changes (~400 MB) inside the VM, as a router would.
      - name: Restore package cache
        uses: actions/cache@v5
        with:
          path: build/pkgcache
          key: pkgcache-previous-${{ hashFiles('image/snapshot-date', 'image/packages.txt') }}
          restore-keys: pkgcache-previous-
      - name: Build the previous release's image
        run: make image-previous
      - name: L4 update test
        run: make test-update
      - name: Keep serial logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: serial-logs-update
          path: build/test-logs/
          if-no-files-found: ignore
